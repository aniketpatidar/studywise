service: studywise
image: <%= ENV.fetch("KAMAL_IMAGE", "studywise") %>

servers:
  web:
    - <%= ENV.fetch("KAMAL_WEB_HOST") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("KAMAL_APP_HOST") %>

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "ghcr.io") %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: info
    DB_HOST: studywise-db
    DB_PORT: "5432"
    DB_USER: studywise
  secret:
    - RAILS_MASTER_KEY
    - STUDYWISE_DATABASE_PASSWORD
    - GEMINI_API_KEY
    - YOUTUBE_API_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

volumes:
  - "studywise_storage:/rails/storage"

accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("KAMAL_DB_HOST", ENV.fetch("KAMAL_WEB_HOST")) %>
    port: "5432:5432"
    env:
      clear:
        POSTGRES_DB: studywise_production
        POSTGRES_USER: studywise
      secret:
        - STUDYWISE_DATABASE_PASSWORD
    volumes:
      - "studywise_postgres:/var/lib/postgresql/data"
