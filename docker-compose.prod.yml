services:
  db:
    image: postgres:16-alpine
    container_name: studywise-prod-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STUDYWISE_DATABASE_PASSWORD}
      POSTGRES_DB: studywise_production
    volumes:
      - studywise_prod_pg_data:/var/lib/postgresql/data
    networks:
      - studywise_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: studywise-prod-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: postgresql://postgres:${STUDYWISE_DATABASE_PASSWORD}@db:5432/studywise_production
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      YOUTUBE_TRANSCRIPT_LANGS: ${YOUTUBE_TRANSCRIPT_LANGS:-"hi,hi-IN,en,en-US"}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
    ports:
      - "${HOST_PORT:-80}:80"  # Configurable port, default 80
    volumes:
      - studywise_prod_storage:/rails/storage
    networks:
      - studywise_internal
      - studywise_frontend
    restart: unless-stopped

networks:
  studywise_internal:
    # Database network - not exposed externally
  studywise_frontend:
    # Web frontend network

volumes:
  studywise_prod_pg_data:
  studywise_prod_storage:
